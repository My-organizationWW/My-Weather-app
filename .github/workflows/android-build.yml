name: Build Android APK (Standalone)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install

      - name: Check Expo SDK health
        # Pin the last expo-doctor build that bundles its runtime deps.
        # 1.21.5+ ships without dependencies and crashes under npx with
        # "Cannot find module '@expo/env'". 1.21.4 supports Expo SDK 58.
        run: npx -y expo-doctor@1.21.4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        # Persists ~/.gradle (dependencies plus the local build cache) between
        # runs. The first run seeds it; later runs can skip unchanged Kotlin,
        # Java and resource tasks. Wrapper validation is off because android/
        # (and its gradlew) is generated by prebuild later in this job.
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          gradle-home-cache-cleanup: true
          validate-wrappers: false

      # No "Setup Android SDK" step: ubuntu-latest runners already ship a full
      # Android SDK (ANDROID_HOME set, licenses accepted). The
      # android-actions/setup-android action is broken — it tries to install
      # the obsolete 'tools' package ("Failed to find package 'tools'").

      - name: Prebuild Android project
        run: npx expo prebuild --platform android --clean

      - name: Grant execute permission for gradlew
        run: chmod +x ./android/gradlew

      - name: Build Release APK
        # x86/x86_64 are emulator-only ABIs: Expo's template compiles CMake for
        # all four architectures, but our APK splits ship only the two ARM
        # ones. In the v1.0.23 log those extra CMake tasks accounted for
        # roughly five minutes. The override lives here (not in
        # gradle.properties) so local emulator builds keep all architectures.
        # --build-cache + setup-gradle above reuse unchanged task outputs on
        # later runs.
        run: cd android && ./gradlew assembleRelease --build-cache -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apks
          path: android/app/build/outputs/apk/release/app-*-release.apk

      - name: Rename APKs with version tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cp android/app/build/outputs/apk/release/app-arm64-v8a-release.apk "MyWeather-${{ github.ref_name }}-arm64-v8a.apk"
          cp android/app/build/outputs/apk/release/app-armeabi-v7a-release.apk "MyWeather-${{ github.ref_name }}-armeabi-v7a.apk"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        # PAT (not GITHUB_TOKEN): releases created with GITHUB_TOKEN do not
        # trigger downstream workflows, which would silently break the
        # readme-history sync. Falls back to GITHUB_TOKEN if unset.
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT || github.token }}
        with:
          files: MyWeather-${{ github.ref_name }}-*.apk
          generate_release_notes: true
